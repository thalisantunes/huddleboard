[project]
name = "huddleboard"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["aiohttp", "Pillow"]

[project.optional-dependencies]
dev = ["pytest", "pytest-aiohttp"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["huddleboard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
