name: ci
on: [push, pull_request]
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e 'bridge[dev]'
      - run: pytest
        working-directory: bridge
  # firmware: added in F1b
