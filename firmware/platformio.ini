[platformio]
default_envs = firebeetle2_esp32s3

[env]
platform = espressif32@55.3.312
framework = arduino
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2@^1.6.9
    jnthas/Improv WiFi Library@^0.0.4
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DCORE_DEBUG_LEVEL=0

[env:firebeetle2_esp32s3]
; No PSRAM enabled on purpose: the image is streamed in 4 KB strips, so the
; firmware needs no framebuffer and also boots on boards without OPI PSRAM.
; The PlatformIO board definition says 4 MB flash; an N16 module only wastes the rest.
board = dfrobot_firebeetle2_esp32s3
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; Placeholder for the Heltec WiFi LoRa 32 V4: PlatformIO has no V4 board yet,
; V3 is the closest ESP32-S3 definition. Pins in config.h are for the FireBeetle
; and must be remapped before flashing a Heltec.
[env:heltec_wifi_lora_32_V3]
board = heltec_wifi_lora_32_V3
