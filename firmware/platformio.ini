[platformio]
default_envs = heltec_v4

[env]
platform = espressif32@55.3.312
framework = arduino
monitor_speed = 115200
lib_deps =
    zinggjm/GxEPD2@^1.6.9
    jnthas/Improv WiFi Library@^0.0.4
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DCORE_DEBUG_LEVEL=0

; --- Heltec WiFi LoRa 32 V4 (primary target) -------------------------------
; Board: esp32-s3-devkitc-1 + qio_qspi, as suggested by espboards.dev.
; NOT CONFIRMED that heltec_wifi_lora_32_V3 is equivalent, so it is not used.
; Flash: datasheet V4.3.1 says 16 MB (NOT measured).
; Serial: assumed UART bridge on UART0 (CDC-on-boot off). If your V4 prints
; nothing, try -DARDUINO_USB_CDC_ON_BOOT=1.
; The OLED and LoRa radio are never initialised. OLED_RST (GPIO21) is left floating.
[heltec_v4_common]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DEPD_SCK=39
    -DEPD_CS=41
    -DEPD_DC=42
    -DEPD_RST=38
    -DEPD_BUSY=34
    -DBTN_A=4
    -DBTN_B=6
    -DBTN_C=3
    -DBTN_C_WAKE=0
    -DBAT_ADC=1
    -DBAT_ADC_CTRL=37
    -DBAT_DIVIDER=4.9f

[env:heltec_v4]
; ESP32-S3R2 (2 MB quad PSRAM; unused by the firmware, enabled as espboards suggests).
board = ${heltec_v4_common.board}
board_build.arduino.memory_type = ${heltec_v4_common.board_build.arduino.memory_type}
board_upload.flash_size = ${heltec_v4_common.board_upload.flash_size}
board_build.partitions = ${heltec_v4_common.board_build.partitions}
build_flags =
    ${heltec_v4_common.build_flags}
    -DBOARD_HAS_PSRAM
    -DEPD_MOSI=40
    ; Vext: datasheet says HIGH = on, espboards says LOW. Sources disagree, test on the bench.
    -DVEXT=36
    -DVEXT_ON_LEVEL=1

[env:heltec_v4r8]
; V4R8 (8 MB PSRAM): Vext is on GPIO40, so MOSI moves to GPIO47 (free in the pin
; table, but NOT CONFIRMED to be on the header). PSRAM is left disabled because it is
; probably octal there, which would take GPIO33-37 (BUSY 34 and ADC_CTRL 37 would clash).
board = ${heltec_v4_common.board}
board_build.arduino.memory_type = ${heltec_v4_common.board_build.arduino.memory_type}
board_upload.flash_size = ${heltec_v4_common.board_upload.flash_size}
board_build.partitions = ${heltec_v4_common.board_build.partitions}
build_flags =
    ${heltec_v4_common.build_flags}
    -DEPD_MOSI=47
    -DVEXT=40
    -DVEXT_ON_LEVEL=1

; --- Generic ESP32-S3 example: DFRobot FireBeetle 2 ESP32-S3 ----------------
; Pins are the config.h defaults. No PSRAM enabled: the image is streamed in 4 KB
; strips, so no framebuffer is needed. The PlatformIO board definition says 4 MB
; flash; the N16R8 module has 16 MB.
[env:firebeetle2_esp32s3]
board = dfrobot_firebeetle2_esp32s3
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
